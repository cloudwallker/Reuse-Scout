name: Offline structure validation

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # 2026-09-13：此矩阵尚未在 GitHub Actions 运行，不代表已通过。
    # 检出/准备 Python/安装固定开发依赖需要网络；测试与校验本身离线。
    # 测试仅用临时合成数据，无个人 token、外部搜索或候选项目执行。
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      # 版本入口： https://github.com/actions/checkout 与 actions/setup-python
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install development parsers
        run: 'python -m pip install --only-binary=:all: -r requirements-dev.txt'
      - name: Test synthetic repositories offline
        run: python -m unittest discover -s tests -v
      - name: Validate distributable structure offline
        run: python tools/validate_skill.py
      - name: Build preview package locally
        run: python tools/build_release.py --version 0.1.1-preview.1
      - name: Check working tree whitespace
        run: git diff --check
      - name: Check current commit whitespace
        run: git show --format= --check HEAD
